name: Check Links

on:
  push:
    paths:
      - 'link-false.yml'
      - 'link.yml'
      - 'manual_check.json'
      - 'check.py'
      - '.github/workflows/check-links.yml'
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-check-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run link checker
        run: python check.py
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}

      - name: Set up Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit generated results
        id: generated-results
        run: |
          git add public/check_links.json public/friend.json link-false.yml link.yml manual_check.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update link check results"
            git push
          fi
